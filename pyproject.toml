[project]
name = "psu-monitor"
version = "0.1.0"
description = "SCPI bench power supply controller and monitor with real-time plotting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7.0",
    "pyqtgraph>=0.13.7",
    "pyserial>=3.5",
    "platformdirs>=4.2.0",
    "numpy>=1.26.0",
]

[project.scripts]
psu-monitor = "psu_monitor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psu_monitor"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
